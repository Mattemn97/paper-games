name: Deploy su Altervista

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Carica file via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ottieni il codice
        uses: actions/checkout@v4

      - name: Verifica presenza secret
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FTP_PASSWORD}" ]; then
            echo "::error::Il secret FTP_PASSWORD non è stato impostato nel repository."
            exit 1
          fi
          echo "Secret FTP_PASSWORD presente: OK"

      - name: Prepara directory di staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-stage
          mkdir -p deploy-stage

          # Copia solo il sito statico e gli asset pubblici.
          # Non pubblica i metadati del repository o il workflow.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.venv/' \
            --exclude='node_modules/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            ./ deploy-stage/

          echo "Contenuto staging:"
          find deploy-stage -maxdepth 2 -type f | sort

      - name: Sincronizza con Altervista
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.mattemn97.altervista.org
          username: mattemn97
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: .
          server-dir: paper-games/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            .git/
            .github/
            .vscode/
            .venv/
            node_modules/
            **/*.log
            **/.DS_Store
