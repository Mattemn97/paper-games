<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1>Paper Game</h1>
            <p>Seleziona un gioco per iniziare</p>
        </header>

        <main class="menu-grid">
            <!-- Card Gioco: Paper Golf -->
            <a href="golf/index.html" class="game-card">
                <div class="game-card-icon golf-icon">⛳</div>
                <div class="game-card-content">
                    <h2>Paper Golf</h2>
                    <p>Metti la pallina in buca affrontando fairway, sabbia e ostacoli d'acqua in un campo generato proceduralmente.</p>
                    <span class="play-badge">Gioca ora →</span>
                </div>
            </a>

            <!-- Esempio di slot per un futuro gioco -->
            <div class="game-card coming-soon">
                <div class="game-card-icon">🚀</div>
                <div class="game-card-content">
                    <h2>Prossimamente</h2>
                    <p>Un nuovo minigame in stile carta e penna è attualmente in fase di sviluppo.</p>
                    <span class="play-badge muted">In arrivo</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
